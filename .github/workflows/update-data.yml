name: Update exhibition data

# 시간 기반 workflow_dispatch만 사용한다 (schedule: 트리거는 쓰지 않음).
# GitHub Actions의 schedule은 부하가 몰리면 수십 분씩 밀릴 수 있어서,
# 정확한 시간에 돌리고 싶다면 cron-job.org 같은 외부 무료 cron 서비스에서
# 아래 workflow_dispatch API를 호출하도록 설정한다. README.md 참고.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 전시 목록 갱신 (art-map)
        run: node scripts/scrape-list.mjs

      - name: 국공립 기관 전시 갱신 (문화포털 API)
        env:
          CULTURE_API_KEY: ${{ secrets.CULTURE_API_KEY }}
        run: node scripts/fetch-culture-api.mjs

      - name: 예술의전당 전시 갱신 (대관 특별전 포함, sac.or.kr)
        run: node scripts/fetch-sac.mjs

      - name: 세종문화회관 전시 갱신 (대관 특별전 포함, sejongpac.or.kr)
        run: node scripts/fetch-sejong.mjs

      - name: 롯데뮤지엄 현재 전시 갱신 (lottemuseum.com)
        run: node scripts/fetch-lotte.mjs

      - name: 리움미술관 전시 갱신 (leeumhoam.org)
        run: node scripts/fetch-leeum.mjs

      - name: 아모레퍼시픽미술관 현재 전시 갱신 (apma.amorepacific.com)
        run: node scripts/fetch-apma.mjs

      - name: 서울미술관 전시 갱신 (seoulmuseum.org)
        run: node scripts/fetch-seoulmuseum.mjs

      - name: 대림미술관/디뮤지엄 전시 갱신 (daelimmuseum.org)
        run: node scripts/fetch-daelim.mjs

      - name: 환기미술관/성곡미술관 전시 갱신
        run: node scripts/fetch-whanki-sungkok.mjs

      - name: 일민미술관 전시 갱신 (ilmin.org)
        run: node scripts/fetch-ilmin.mjs

      - name: 관람 후기 갱신 (네이버 블로그, NAVER API HUB)
        if: ${{ secrets.NAVER_API_HUB_CLIENT_ID != '' }}
        env:
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
        run: node scripts/fetch-review-snippets.mjs

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exhibitions.json
          git diff --cached --quiet || git commit -m "chore: 전시 데이터 갱신"
          git push
