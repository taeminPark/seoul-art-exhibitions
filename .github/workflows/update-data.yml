name: Update exhibition data

# 시간 기반 workflow_dispatch만 사용한다 (schedule: 트리거는 쓰지 않음).
# GitHub Actions의 schedule은 부하가 몰리면 수십 분씩 밀릴 수 있어서,
# 정확한 시간에 돌리고 싶다면 cron-job.org 같은 외부 무료 cron 서비스에서
# 아래 workflow_dispatch API를 호출하도록 설정한다. README.md 참고.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # if: 조건에서는 secrets를 직접 참조할 수 없어서(파싱 에러) env를 거쳐 확인한다.
      HAS_NAVER_KEYS: ${{ secrets.NAVER_API_HUB_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 전시 목록 갱신 (art-map)
        id: scrape_artmap
        continue-on-error: true
        run: node scripts/scrape-list.mjs

      - name: 국공립 기관 전시 갱신 (문화포털 API)
        id: culture_api
        continue-on-error: true
        env:
          CULTURE_API_KEY: ${{ secrets.CULTURE_API_KEY }}
        run: node scripts/fetch-culture-api.mjs

      - name: 예술의전당 전시 갱신 (대관 특별전 포함, sac.or.kr)
        id: sac
        continue-on-error: true
        run: node scripts/fetch-sac.mjs

      - name: 세종문화회관 전시 갱신 (대관 특별전 포함, sejongpac.or.kr)
        id: sejong
        continue-on-error: true
        run: node scripts/fetch-sejong.mjs

      - name: 롯데뮤지엄 현재 전시 갱신 (lottemuseum.com)
        id: lotte
        continue-on-error: true
        run: node scripts/fetch-lotte.mjs

      - name: 리움미술관 전시 갱신 (leeumhoam.org)
        id: leeum
        continue-on-error: true
        run: node scripts/fetch-leeum.mjs

      - name: 아모레퍼시픽미술관 현재 전시 갱신 (apma.amorepacific.com)
        id: apma
        continue-on-error: true
        run: node scripts/fetch-apma.mjs

      - name: 서울미술관 전시 갱신 (seoulmuseum.org)
        id: seoulmuseum
        continue-on-error: true
        run: node scripts/fetch-seoulmuseum.mjs

      - name: 대림미술관/디뮤지엄 전시 갱신 (daelimmuseum.org)
        id: daelim
        continue-on-error: true
        run: node scripts/fetch-daelim.mjs

      - name: 환기미술관/성곡미술관 전시 갱신
        id: whanki_sungkok
        continue-on-error: true
        run: node scripts/fetch-whanki-sungkok.mjs

      - name: 일민미술관 전시 갱신 (ilmin.org)
        id: ilmin
        continue-on-error: true
        run: node scripts/fetch-ilmin.mjs

      - name: 관람 후기 갱신 (네이버 블로그, NAVER API HUB)
        id: reviews
        continue-on-error: true
        if: ${{ env.HAS_NAVER_KEYS == 'true' }}
        env:
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
        run: node scripts/fetch-review-snippets.mjs

      # 수집 단계는 하나가 실패해도 다음 단계로 넘어간다 (continue-on-error).
      # 실패한 스크립트는 파일을 쓰기 전에 종료하므로 그 출처의 기존 전시는 그대로 남고,
      # 나머지 출처는 정상적으로 갱신된다. 실패 여부는 맨 마지막 단계에서 다시 알린다.
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exhibitions.json
          git diff --cached --quiet || git commit -m "chore: 전시 데이터 갱신"
          git push

      - name: 포스터 이미지 점검
        id: check_images
        run: node scripts/check-images.mjs
        env:
          REPORT_PATH: ${{ runner.temp }}/broken-images-report.md

      - name: 깨진 이미지 이슈 자동 생성/갱신/종료
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ runner.temp }}/broken-images-report.md
        run: |
          TITLE="⚠️ 깨진 포스터 이미지 감지"
          EXISTING=$(gh issue list --state open --limit 500 --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -n1)
          if [ "${{ steps.check_images.outputs.broken_count }}" != "0" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body-file "$REPORT_PATH"
              echo "기존 이슈 #$EXISTING 갱신"
            else
              gh issue create --title "$TITLE" --body-file "$REPORT_PATH"
              echo "새 이슈 생성"
            fi
          elif [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "재검사 결과 깨진 이미지가 없어 자동으로 닫습니다."
            echo "이슈 #$EXISTING 자동 종료"
          else
            echo "깨진 이미지 없음, 열린 이슈도 없음"
          fi

      - name: 수집 실패 알림
        if: ${{ always() }}
        env:
          OUTCOMES: >-
            art-map=${{ steps.scrape_artmap.outcome }}
            문화포털API=${{ steps.culture_api.outcome }}
            예술의전당=${{ steps.sac.outcome }}
            세종문화회관=${{ steps.sejong.outcome }}
            롯데뮤지엄=${{ steps.lotte.outcome }}
            리움=${{ steps.leeum.outcome }}
            아모레퍼시픽=${{ steps.apma.outcome }}
            서울미술관=${{ steps.seoulmuseum.outcome }}
            대림=${{ steps.daelim.outcome }}
            환기성곡=${{ steps.whanki_sungkok.outcome }}
            일민=${{ steps.ilmin.outcome }}
            관람후기=${{ steps.reviews.outcome }}
        run: |
          FAILED=""
          for pair in $OUTCOMES; do
            if [ "${pair#*=}" = "failure" ]; then FAILED="$FAILED ${pair%%=*}"; fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::수집 실패(기존 데이터 유지):$FAILED"
            exit 1
          fi
          echo "모든 수집 성공"
